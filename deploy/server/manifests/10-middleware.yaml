# ============================================================================
# 中间件（platform 命名空间）
#   PostgreSQL  postgresql:5432   库/用户/密码 quenching/quenching
#   Redis       redis:6379        无密码
#   RabbitMQ    rabbitmq:5672     guest/guest
#   Prometheus  prometheus-server:9090
# Service 名称与 Helm values external 段严格对齐。
# 存储使用 local-path（数据盘 /data/k3s/storage）。
# ============================================================================
---
# ----------------------------- PostgreSQL ----------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: quenching
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: platform
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
    spec:
      # local-path 首次挂载目录默认 root:root 755，postgres 镜像以 uid/gid 70
      # 运行，initdb 会因目录不可写而失败；先用 root 修正属主（幂等）。
      initContainers:
        - name: init-dbdir
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext: { runAsUser: 0 }
          command: ["sh", "-c", "chown -R 70:70 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args: ["-c", "timezone=Asia/Shanghai", "-c", "log_timezone=Asia/Shanghai", "-c", "log_destination=stderr", "-c", "logging_collector=off"]
          ports:
            - { name: tcp-postgresql, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: quenching }
            - { name: POSTGRES_USER, value: quenching }
            - { name: TZ, value: Asia/Shanghai }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U quenching -d quenching"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgresql
  ports:
    - { name: tcp-postgresql, port: 5432, targetPort: 5432, protocol: TCP }
---
# -------------------------------- Redis ------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      priorityClassName: quenching-platform
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: tcp-redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - { name: tcp-redis, port: 6379, targetPort: 6379, protocol: TCP }
---
# ------------------------------- RabbitMQ ----------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      priorityClassName: quenching-platform
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: amqp, containerPort: 5672 }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: guest }
            - { name: RABBITMQ_DEFAULT_PASS, value: guest }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - { name: amqp, port: 5672, targetPort: 5672, protocol: TCP }
---
# ------------------------------ Prometheus ---------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: quenching-single
    scrape_configs:
      # kubelet 内置 cAdvisor：容器 CPU/内存等核心指标
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__address__]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?
            replacement: $1:10250
          - source_labels: [__metrics_path__]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
            replacement: /metrics/cadvisor
      # 沙箱命名空间内 Pod 的业务指标（如模板暴露 /metrics）
      - job_name: sandbox-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [platform]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-server
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-server
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      # local-path 数据目录同样需要先交给 nobody(65534)。
      initContainers:
        - name: init-datadir
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext: { runAsUser: 0 }
          command: ["sh", "-c", "chown -R 65534:65534 /prometheus && chmod 755 /prometheus"]
          volumeMounts:
            - { name: data, mountPath: /prometheus }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - { name: web, containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-server
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus-server
  ports:
    - { name: web, port: 9090, targetPort: 9090, protocol: TCP }
