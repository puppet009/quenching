apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: quenching-platform
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
value: 10000
globalDefault: false
preemptionPolicy: Never
description: "Platform service scheduling priority; never evicts active training."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: quenching-training
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
value: 1000
globalDefault: false
preemptionPolicy: Never
description: "Training services and simulator scheduling priority."
