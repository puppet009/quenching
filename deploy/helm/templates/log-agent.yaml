{{- if dig "logging" "collector" "enabled" false (.Values | mustToJson | fromJson) }}
{{- if ne (include "quenching.logEnabled" .) "true" }}
{{- fail "logging.collector.enabled requires logging.persistence.enabled" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quenching-log-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quenching.fullname" . }}-log-agent
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quenching.fullname" . }}-log-agent
subjects:
  - kind: ServiceAccount
    name: quenching-log-agent
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "quenching.fullname" . }}-log-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quenching-log-agent
data:
  vector.yaml: |
    {{- .Files.Get "files/log-agent.yaml" | nindent 4 }}
  retention.sh: |
    {{- .Files.Get "files/retain-infrastructure-logs.sh" | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: quenching-log-agent
  labels:
    app.kubernetes.io/component: log-agent
spec:
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: quenching-log-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quenching-log-agent
      annotations:
        checksum/config: {{ printf "%s%s" (.Files.Get "files/log-agent.yaml") (.Files.Get "files/retain-infrastructure-logs.sh") | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: quenching-log-agent
      priorityClassName: quenching-platform
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      initContainers:
        - name: prepare-state
          image: busybox:1.36
          command: ["sh", "-ec", "mkdir -p /var/log/quenching/.collector/\"$NODE_NAME\""]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext:
            runAsUser: 0
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "1m", memory: "8Mi"}
            limits: {cpu: "50m", memory: "32Mi"}
          volumeMounts:
            - {name: logs, mountPath: /var/log/quenching}
      containers:
        - name: log-agent
          image: {{ include "quenching.image" (list . "log-agent") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - {name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION, value: "true"}
            - name: VECTOR_SELF_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          securityContext:
            runAsUser: 0
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "20m", memory: "64Mi"}
            limits: {cpu: "300m", memory: "256Mi"}
          volumeMounts:
            - {name: config, mountPath: /etc/vector, readOnly: true}
            - {name: pod-logs, mountPath: /var/log/pods, readOnly: true}
            - {name: logs, mountPath: /var/log/quenching}
        - name: retention
          image: busybox:1.36
          command: ["sh", "-c", "while :; do sh /etc/vector/retention.sh; sleep 3600; done"]
          securityContext:
            runAsUser: 0
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "1m", memory: "8Mi"}
            limits: {cpu: "50m", memory: "32Mi"}
          volumeMounts:
            - {name: config, mountPath: /etc/vector, readOnly: true}
            - {name: logs, mountPath: /var/log/quenching}
      volumes:
        - name: config
          configMap: {name: quenching-log-agent}
        - name: pod-logs
          hostPath: {path: /var/log/pods, type: Directory}
        - name: logs
          {{- if include "quenching.logHostPath" . }}
          hostPath: {path: {{ include "quenching.logHostPath" . | quote }}, type: Directory}
          {{- else }}
          persistentVolumeClaim: {claimName: {{ include "quenching.name" . }}-logs}
          {{- end }}
{{- end }}
