{{/* 平台密钥：JWT、DB DSN、AMQP、内部 API Key。
     生产环境建议改为从既有 Secret 引用（externalSecret），此处给出可直接渲染的默认来源。 */}}
apiVersion: v1
kind: Secret
metadata:
  name: platform-secret
  labels:
    {{- include "quenching.labels" . | nindent 4 }}
type: Opaque
stringData:
  internal-token: {{ .Values.global.internalToken | quote }}
  jwt-secret: {{ .Values.global.jwtSecret | quote }}
  db-dsn: {{ include "quenching.dbDsn" . | quote }}
  amqp-url: {{ include "quenching.amqpUrl" . | quote }}
  ws-internal-api-key: {{ .Values.observability.wsGatewayApiKey | quote }}
---
{{/* ai-service 的 LLM Key 独立成 Secret；MOCK 模式可为空。 */}}
apiVersion: v1
kind: Secret
metadata:
  name: ai-service-secret
  labels:
    {{- include "quenching.labels" . | nindent 4 }}
type: Opaque
stringData:
  llm-api-key: {{ .Values.ai.llmApiKey | quote }}
