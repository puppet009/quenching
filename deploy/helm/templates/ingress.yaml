{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "quenching.fullname" . }}
  labels:
    {{- include "quenching.labels" . | nindent 4 }}
  annotations:
    # WebSocket 长连接超时调大
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
        - {{ .Values.ingress.wsHost }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ (index .Values "services" "api-gateway" "port") }}
    - host: {{ .Values.ingress.wsHost }}
      http:
        paths:
          # g7：ws-gateway 已并入 api-gateway，WebSocket 走 /ws 路径
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: {{ (index .Values "services" "api-gateway" "port") }}
{{- end }}
