server:
  port: 8085
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: mall
    password: ${MYSQL_PASSWORD}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 8
  data:
    mongodb:
      host: mongo
      port: 27017
      database: mall-port
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 2s
  rabbitmq:
    host: rabbitmq
    port: 5672
    virtual-host: /mall
    username: mall
    password: ${RABBIT_PASSWORD}
    listener:
      simple:
        missing-queues-fatal: false

jwt:
  secret: ${JWT_SECRET}
mongo:
  insert:
    sqlEnable: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  config: file:/app/config/logback-sandbox.xml
  level:
    root: info

# Real payment gateway and direct-pay shortcut remain disabled.
# Platform sandbox simulator uses a separate signed, sandbox-profile callback.
alipay:
  gatewayUrl: http://127.0.0.1:9/disabled
  appId: quenching-loading-only
  appPrivateKey: ""
  alipayPublicKey: ""
  returnUrl: ""
  notifyUrl: ""

quenching:
  sandbox-payment-secret: ${SANDBOX_PAYMENT_SECRET}
