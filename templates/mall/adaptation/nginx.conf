server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Do not permit public payment or the upstream direct-pay shortcut.
    location ^~ /api/alipay/ {
        default_type application/json;
        return 503 '{"code":503,"message":"Payment is unavailable during loading validation"}';
    }
    location = /api/order/paySuccess {
        default_type application/json;
        return 503 '{"code":503,"message":"Payment is unavailable during loading validation"}';
    }

    location ^~ /api/sandbox/payment/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://mall-portal:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
