apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  mysql-password: {{ include "mall.password" (dict "root" . "key" "mysql-password" "value" .Values.credentials.mysqlPassword "length" 32) | quote }}
  mysql-root-password: {{ include "mall.password" (dict "root" . "key" "mysql-root-password" "value" .Values.credentials.mysqlRootPassword "length" 32) | quote }}
  rabbit-password: {{ include "mall.password" (dict "root" . "key" "rabbit-password" "value" .Values.credentials.rabbitPassword "length" 32) | quote }}
  jwt-secret: {{ include "mall.password" (dict "root" . "key" "jwt-secret" "value" .Values.credentials.jwtSecret "length" 96) | quote }}

  sandbox-payment-key: {{ include "mall.password" (dict "root" . "key" "sandbox-payment-key" "value" "" "length" 64) | quote }}
