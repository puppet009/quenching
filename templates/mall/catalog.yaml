name: mall 电商交易实训
description: >-
  走进一个真实的 Java 电商交易系统，从商品查询、购物车到订单与库存，沿着业务请求追踪应用、数据库、缓存和消息队列之间的依赖。
  在故障现场练习定位瓶颈、验证修复与权衡方案，把“会写功能”进一步推进到“能独立分析和处理系统问题”。
cover:
  file: home.png
  alt: mall 商城首页，包含商品搜索、品牌专区和商品展示
overview:
  - >-
    本项目基于开源 mall 与配套商城前台。训练环境由商城界面、Spring Boot 业务应用，以及 MySQL、Redis、RabbitMQ、MongoDB 等组件组成。
    一次页面操作可能经过身份校验、缓存访问、数据库读写与异步处理；你需要把看到的异常，放回这条依赖链中理解。
  - >-
    训练关注真实业务中的工程判断：页面变慢，瓶颈在应用计算、数据库连接还是网络等待？订单处理受阻，影响的是请求入口还是异步任务？
    从确认影响范围、提出假设，到收集证据、验证恢复，再进一步讨论容量规划、超时设计与故障隔离，形成完整的排查思路。
business_scenarios:
  - 用户与会话
  - 商品浏览与详情查询
  - 购物车与订单处理
  - 库存与数据访问
  - 订单异步任务
learning_objectives:
  - 从业务症状划定影响范围：区分商品查询变慢、购物车写入失败和订单处理受阻，建立请求路径与组件依赖图，按影响面安排排查顺序。
  - 用证据检验性能假设：结合响应时间、错误率、CPU、内存及线程状态，区分计算瓶颈、资源争用与等待阻塞，避免只凭一条报错下结论。
  - 追踪应用与数据库之间的等待：检查连接池、连接获取耗时和查询表现，分析超时如何向业务入口传递，并理解连接数、并发量与数据库承载能力的关系。
  - 分析缓存与消息故障的业务后果：关联 Redis 内存和连接限制、消息消费与磁盘水位，判断异常如何影响业务写入、订单异步处理及恢复后的积压消化。
  - 验证修复是否真正有效：比较调整前后的业务结果和运行指标，区分临时止损与根因修复，检查重试、副作用及资源调整是否引入新的风险。
  - 把一次排障转化为工程能力：复盘证据链与决策过程，进一步思考容量预算、超时与重试边界、故障隔离和可观测性设计，形成可迁移到其他项目的方法。
audience:
  - 已能编写业务接口，希望提升独立排障与系统分析能力的初级开发者。
  - 熟悉 Java / Spring Boot，希望理解数据库、缓存和消息队列如何共同影响业务的开发者。
  - 具备基本 Linux 命令、HTTP 接口和数据库操作基础，愿意用证据验证判断。
services:
  frontend:
    display_name: 商城前台
    description: 提供商品浏览、购物车等用户操作界面。
  mall-portal:
    display_name: 商城业务服务
    description: 承载用户、商品查询、购物车和订单相关接口。
  mysql:
    display_name: 交易数据库
    description: 保存用户、商品、库存和订单等业务数据。
  redis:
    display_name: 缓存与临时状态
    description: 承载业务缓存与临时状态，连接应用访问模式、内存预算和请求承载能力。
  rabbitmq:
    display_name: 消息队列
    description: 处理订单相关异步消息，连接业务请求与后台处理。
  mongo:
    display_name: 文档数据库
    description: 保存商品收藏、浏览记录等文档数据。
