name: Python AI Service CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/ai-service/**'
      - 'scripts/ci/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'services/ai-service/**'
      - 'scripts/ci/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  LLM_MOCK: 'true'
  LLM_API_KEY: ''
  APP_ENV: test

jobs:
  quality:
    name: Format, lint and compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned quality tools
        run: python -m pip install black==24.10.0 ruff==0.9.2
      - name: Black (handwritten source; generated stubs excluded in pyproject)
        run: python -m black --check app tests
      - name: Ruff
        run: python -m ruff check app tests
      - name: Compile Python source
        run: python -m compileall -q app tests

  unit-test:
    name: Mocked unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt
      - name: Install service and pinned test dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.5 pytest-cov==6.0.0
      - name: Run without provider credentials
        run: python -m pytest tests -v --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python
          path: services/ai-service/coverage.xml

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install pip-audit==2.9.0
      - name: Audit pinned service dependencies
        run: python -m pip_audit -r requirements.txt

  summary:
    name: Python CI summary
    needs: [quality, unit-test, security-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require all checks, including installation and audit
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci/check_results.py --required quality unit-test security-audit
