log_format quenching_json escape=json '{"ts":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":"$request_time","upstream_status":"$upstream_status","trace_id":"$upstream_http_x_trace_id"}';
server {
    access_log /dev/stdout quenching_json;
    error_log /dev/stderr warn;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 沙箱终端 WebSocket：exec 端点必须带升级头，否则握手失败、终端一直
    # “连接中”。正则 location 优先于下面的前缀 /api/，普通 API 不受影响。
    location ~ ^/api/v1/sandboxes/[0-9]+/exec {
        proxy_pass http://api-gateway.platform.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # API 反向代理到平台网关
    location /api/ {
        proxy_pass http://api-gateway.platform.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式回复：关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket（沙箱终端 / 实时推送）
    location /ws {
        proxy_pass http://api-gateway.platform.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
