log_format quenching_json escape=json '{"ts":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":"$request_time","upstream_status":"$upstream_status","trace_id":"$upstream_http_x_trace_id"}';
server {
    access_log /dev/stdout quenching_json;
    error_log /dev/stderr warn;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理到平台网关
    location /api/ {
        proxy_pass http://api-gateway.platform.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://api-gateway.platform.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA 路由回退（/admin/* 与 /login 在独立端口下统一回退）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
