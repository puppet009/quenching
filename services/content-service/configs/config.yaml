server:
  addr: ":8082"
  mode: "debug"   # debug / release

log:
  level: "info"   # debug / info / warn / error
  dir: ""         # 落盘目录，空=仅 stdout；集群由 Helm 注入

db:
  # 本地 docker-compose 默认值；生产用环境变量 DB_DSN 覆盖
  dsn: "postgres://quenching:quenching@localhost:5432/quenching?sslmode=disable"
  max_conns: 20

templates:
  # 官方预置模板根目录；生产镜像内为 /templates（见 Dockerfile ENV TEMPLATES_ROOT）。
  # 目录不存在时模板列表为空、服务照常启动。
  root: "../../../templates"

internal:
  # 服务间共享密钥；留空时 /internal/v1 不校验请求头（本地开发）。
  # 云上部署须经环境变量 INTERNAL_TOKEN 注入并配合网络策略隔离。
  token: ""

fault_engine:
  # 故障引擎直连地址（东西向流量，不经网关）；云上为 http://fault-engine:8088。
  base_url: "http://localhost:8088"
